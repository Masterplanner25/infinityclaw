# Claw configuration — Phase 4 milestone test

[gateway]
host = "127.0.0.1"
port = 18789

[session]
dm_scope = "per-peer"
max_messages = 200
compaction_threshold = 40   # summarize when messages >= this
compaction_keep_recent = 20 # keep this many after compaction

[memory]
enabled = true   # set false to disable memory tools and injection

# ------------------------------------------------------------------
# Agents
# ------------------------------------------------------------------

[[agents.list]]
id = "main"
name = "Claw"
default = true

[[agents.list]]
id = "coder"
name = "Claw Coder"

[agents.list.model]
primary = "claude-haiku-4-5-20251001"
max_tokens = 2048

# ------------------------------------------------------------------
# Cron jobs
# ------------------------------------------------------------------

[[cron]]
id = "heartbeat"
agent_id = "main"
prompt = "You are performing a periodic self-check. Respond with exactly: 'Heartbeat OK — [timestamp placeholder]'"
cron = "0 8 * * *"
delivery = "none"
enabled = true

# ------------------------------------------------------------------
# AINDY integration (optional)
# ------------------------------------------------------------------

[aindy]
enabled = false
# url = "http://localhost:8000"
# api_key = ""
# emit_events = true
# memory_backend = "local"   # "local" | "aindy" | "aindy-fallback"
# effects_backend = "local"  # "local" | "aindy" -- delivery through the runtime's tool seam (needs database_url + a UUID user_id)
# database_url = ""           # the runtime's Postgres (AINDY_DATABASE_URL)
# user_id = "claw"
# mounted = false            # set true when running inside AINDY platform layer

# ------------------------------------------------------------------
# Skills (empty — use bundled defaults)
# ------------------------------------------------------------------

[skills]

# ------------------------------------------------------------------
# Channels
# ------------------------------------------------------------------

[channels.webchat]
enabled = true

# Uncomment a block to enable that adapter. Each is built at startup by
# claw/channels/factory.py; a secret may be left out of the file and read from the
# environment instead (TELEGRAM_BOT_TOKEN, DISCORD_BOT_TOKEN, SLACK_BOT_TOKEN,
# SLACK_APP_TOKEN, MATRIX_ACCESS_TOKEN, SIGNAL_PHONE). Add `enabled = false` to keep a
# channel configured but off.

# [channels.extra.telegram]
# token = "BOT_TOKEN"          # or leave out and set $TELEGRAM_BOT_TOKEN
# allowed_users = ["12345"]    # empty = anyone who finds the bot
# require_mention = false      # groups only; DMs are never mention-gated

# [channels.extra.discord]
# token = "BOT_TOKEN"
# guild_ids = []

# [channels.extra.slack]
